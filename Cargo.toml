[package]
name = "qwen-pr"
version = "0.1.0"
edition = "2021"
description = "Automated PR workflow with AI-powered build failure remediation"

[[bin]]
name = "qwen-pr"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
